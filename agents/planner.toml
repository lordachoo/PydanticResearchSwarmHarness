# Planner: splits the task into sub-questions.
prompt = "planner"          # prompts/<prompt>.md
request_limit = 5           # model requests per run
timeout_s = 1800            # wall-clock cap per run of this agent (30 min); waiting for a free endpoint not counted

output_mode = "prompted"     # prompted | native | tool  (LLM_OUTPUT_MODE overrides)

stream = true               # stream model output so the progress page shows it growing

[model_settings]            # passed straight to the model; any OpenAI-compatible knob
temperature = 0.2
max_tokens = 16384
